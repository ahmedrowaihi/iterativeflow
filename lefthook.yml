pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{ts,tsx,js,jsx}"
      exclude:
        - "dist/**"
        - "node_modules/**"
      run: pnpm exec oxlint {staged_files}
    - name: format
      glob: "*.{ts,tsx,js,jsx,md,json,yml,yaml}"
      exclude:
        - "pnpm-lock.yaml"
        - "dist/**"
        - "node_modules/**"
        - "etc/**"
        - "**/etc/**"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

pre-push:
  parallel: false
  jobs:
    - name: typecheck
      run: pnpm run typecheck
    - name: test
      run: SKIP_TESTCONTAINERS=1 pnpm test
    - name: build
      run: pnpm run build
    - name: api-check
      run: pnpm run api:check
