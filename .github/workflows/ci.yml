name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  test:
    name: typecheck + tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    concurrency:
      group: ci-test-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # Node 22+ only: the durable-objects equivalence test uses the built-in `node:sqlite`
        # (added in 22.5), and the testcontainers/undici stack needs 22+ (`markAsUncloneable`).
        # The packages run on Node 20 at runtime; the test tooling does not.
        node: ["22"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      # Suites start their own Postgres + DynamoDB Local via testcontainers (Docker is available
      # on hosted runners), so no service containers or SKIP_TESTCONTAINERS here.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test:coverage
      - run: pnpm run build
      # Packaging gate: exports/files/types must actually point at what the build emits.
      - run: pnpm run publint
      # Public-API gate: regenerate the committed .d.ts snapshots; a public-surface change fails
      # here until etc/*.api.md is regenerated and committed.
      - run: pnpm run api:snapshot && git diff --exit-code etc

  release:
    name: changesets
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Never cancelled: `changeset publish` walks 12 packages sequentially and npm publishes are not
    # revocable, so a cancel mid-loop would leave a half-published `fixed` version set.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # persist-credentials stays on: this job pushes the version branch itself.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Both paths below need a committer identity: the version PR commits, and `changeset publish`
      # creates ANNOTATED tags (`git tag -m`), which fail without one. A runner has no global
      # identity, so setting it inside a path-specific step silently loses every release tag.
      - name: git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: detect pending changesets
        id: changesets
        run: |
          pending=false
          if [ -f .changeset/pre.json ]; then
            # Prerelease mode keeps changeset files until `pre exit`, so file-existence is always
            # true and publish would never fire. "Pending" here means a changeset NOT yet recorded
            # (applied) in pre.json — once the version PR records them all, this flips to false.
            applied=$(node -p "(require('./.changeset/pre.json').changesets||[]).join('\n')")
            for f in .changeset/*.md; do
              [ -e "$f" ] || continue
              name=$(basename "$f" .md)
              [ "$name" = "README" ] && continue
              printf '%s\n' "$applied" | grep -qxF "$name" || pending=true
            done
          elif ls .changeset/*.md 2>/dev/null | grep -v README.md | grep -q .; then
            pending=true
          fi
          echo "hasChangesets=$pending" >> "$GITHUB_OUTPUT"

      - name: open version PR
        if: steps.changesets.outputs.hasChangesets == 'true'
        run: |
          git checkout -B changeset-release/main
          pnpm changeset version
          pnpm install --lockfile-only
          # Verify the versioned tree HERE. A push made with GITHUB_TOKEN fires no workflow events,
          # so this branch's own checks never run — without this the one commit that rewrites all 12
          # manifests and the lockfile is the one commit nothing checks.
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build
          git add .
          git commit -m "chore: version packages"
          git push -f origin changeset-release/main
          gh pr create --base main --head changeset-release/main \
            --title "chore: version packages" \
            --body "Automated changesets version PR." \
            || echo "PR already open — branch force-pushed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `published` gates the tag/release steps below: this path also runs on an ordinary main push
      # with nothing pending, where `changeset publish` is a no-op and there is nothing to tag.
      - name: publish via oidc
        id: publish
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          set -eo pipefail
          pnpm changeset publish | tee "$RUNNER_TEMP/publish.log"
          if grep -q "New tag:" "$RUNNER_TEMP/publish.log"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NPM_CONFIG_PROVENANCE: "true"

      # Push exactly the per-package tags this publish created — `--tags` would also re-offer every
      # historical tag and fail the job on the first one whose local value differs from the remote.
      - name: push package tags
        if: steps.publish.outputs.published == 'true'
        run: |
          tags=$(git tag --points-at HEAD)
          [ -n "$tags" ] || { echo "publish reported tags but none exist on HEAD"; exit 1; }
          echo "$tags" | sed 's|^|refs/tags/|' | xargs git push origin

      # One Release per version — `fixed` bumps every package together, so 12 per-package releases
      # would say the same thing 12 times. It is anchored on core's own tag rather than a bare
      # `vX.Y.Z`: the `v*` namespace belongs to the pre-monorepo library, which reached v5.6.0, so a
      # `v2.3.0` tag both collides with that line and sorts below it.
      - name: github release
        if: steps.publish.outputs.published == 'true'
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          tag="@iterativeflow/core@$version"
          notes=$(awk -v v="## $version" '$0 == v {f=1; next} f && /^## / {exit} f' packages/core/CHANGELOG.md)
          # Guarded so re-running a release job is a no-op rather than a failure.
          gh release view "$tag" >/dev/null 2>&1 \
            || printf '%s\n' "$notes" | gh release create "$tag" --title "v$version" --verify-tag --notes-file -
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
