name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  test:
    name: typecheck + tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 22+ only: the durable-objects equivalence test uses the built-in `node:sqlite`
        # (added in 22.5), and the testcontainers/undici stack needs 22+ (`markAsUncloneable`).
        # The packages run on Node 20 at runtime; the test tooling does not.
        node: ["22"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      # Suites start their own Postgres + DynamoDB Local via testcontainers (Docker is available
      # on hosted runners), so no service containers or SKIP_TESTCONTAINERS here.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test:coverage
      - run: pnpm run build
      # Public-API gate: regenerate the committed .d.ts snapshots; a public-surface change fails
      # here until etc/*.api.md is regenerated and committed.
      - run: pnpm run api:snapshot && git diff --exit-code etc

  release:
    name: changesets
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # persist-credentials stays on: this job pushes the version branch itself.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: detect pending changesets
        id: changesets
        run: |
          pending=false
          if [ -f .changeset/pre.json ]; then
            # Prerelease mode keeps changeset files until `pre exit`, so file-existence is always
            # true and publish would never fire. "Pending" here means a changeset NOT yet recorded
            # (applied) in pre.json — once the version PR records them all, this flips to false.
            applied=$(node -p "(require('./.changeset/pre.json').changesets||[]).join('\n')")
            for f in .changeset/*.md; do
              [ -e "$f" ] || continue
              name=$(basename "$f" .md)
              [ "$name" = "README" ] && continue
              printf '%s\n' "$applied" | grep -qxF "$name" || pending=true
            done
          elif ls .changeset/*.md 2>/dev/null | grep -v README.md | grep -q .; then
            pending=true
          fi
          echo "hasChangesets=$pending" >> "$GITHUB_OUTPUT"

      - name: open version PR
        if: steps.changesets.outputs.hasChangesets == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B changeset-release/main
          pnpm changeset version
          pnpm install --lockfile-only
          git add .
          git commit -m "chore: version packages"
          git push -f origin changeset-release/main
          gh pr create --base main --head changeset-release/main \
            --title "chore: version packages" \
            --body "Automated changesets version PR." \
            || echo "PR already open — branch force-pushed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: publish via oidc
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm changeset publish
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: push tags
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: git push --tags
